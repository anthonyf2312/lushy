name: Bug report
description: Something in Lushy looks or works wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. If the theme vanished after Spotify updated itself, run the installer again first: that usually fixes it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you saw instead, and where in Spotify. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: spotify
    attributes:
      label: Spotify version
      description: In Spotify, open the ⋯ menu at the top left, then Help → About Spotify.
      placeholder: 1.3.7.2752
    validations:
      required: true
  - type: input
    id: spicetify
    attributes:
      label: Spicetify version
      description: Run `spicetify -v` in PowerShell.
      placeholder: 2.46.4
    validations:
      required: true
  - type: dropdown
    id: spicy-lyrics
    attributes:
      label: Is Spicy Lyrics installed?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Other extensions
      description: Anything else you've installed from the Spicetify Marketplace, in case it clashes.
